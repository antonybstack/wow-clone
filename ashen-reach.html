<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101411}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;outline:none;touch-action:none}#help{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#c2c4ae99;font:11px monospace;text-shadow:0 1px 3px #000;pointer-events:none;max-width:min(520px,70vw);line-height:1.8;text-align:center}#help b{color:#e0dcc3;font-weight:normal}#error{position:fixed;inset:15%;color:#ead1b5;background:#261818;white-space:pre-wrap;display:none;padding:24px;z-index:4}body.clean #help{display:none}

.game-menu-panel button:hover,.game-menu-panel button:focus-visible{background:#241c16;border-color:#c4a06a;outline:none}

.load-scene{position:absolute;inset:0;pointer-events:none}

.load-ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#1c2418,#0c100e 70%)}

.load-tree.t3{left:72%;transform:scale(.85)}

.load-fire{position:absolute;left:50%;bottom:22%;width:180px;height:90px;transform:translateX(-50%);background:radial-gradient(ellipse at center,#ffb02699,#b0370400 68%);filter:blur(1px);animation:load-flicker 1.8s ease-in-out infinite}

#loading-line{min-height:1.4em;margin:12px 0 0;color:#e7bc7c;font:16px Georgia,serif}
.load-ember{width:min(240px,72vw);height:4px;margin:16px auto 0;background:#160e08;border:1px solid #815a2e;overflow:hidden}

@media (max-width:640px){
  .load-moon{width:36px;height:36px;top:8%}

  .load-fire,.load-ember i{animation:none}
  .load-ember i{width:55%;transform:none}
}
