<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/ashen-reach/fire-blast/fire_01.png"><title>Ashen Reach — art study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101411}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;outline:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101411;color:#b6b89e;font:15px Georgia;z-index:3}#help{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#c2c4ae99;font:11px monospace;text-shadow:0 1px 3px #000;pointer-events:none;max-width:min(520px,70vw);line-height:1.8;text-align:center}#help b{color:#e0dcc3;font-weight:normal}#error{position:fixed;inset:15%;color:#ead1b5;background:#261818;white-space:pre-wrap;display:none;padding:24px;z-index:4}body.clean #help{display:none}

#combat{position:fixed;inset:0;pointer-events:none;color:#ddd3b3;font-family:Georgia,serif;text-shadow:0 2px 3px #000}#combat[hidden],[hidden]{display:none!important}.spell-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(2,64px);justify-items:center;gap:8px}.spell-bar button{width:48px;height:48px;padding:0;position:relative;border:1px solid #9b7650;background:#181511;box-shadow:0 0 0 2px #171714,0 4px 14px #000;cursor:pointer;pointer-events:auto;color:#ffe1a8}.spell-bar img{width:100%;height:100%;filter:sepia(1) saturate(7);image-rendering:pixelated}.spell-bar button:after{content:'';position:absolute;inset:0;background:#080908c9;transform-origin:bottom;transform:scaleY(var(--cooldown,0))}.spell-bar kbd{position:absolute;left:3px;top:1px;z-index:2;font-size:10px}.spell-bar strong{position:absolute;inset:0;display:grid;place-items:center;z-index:3;font:16px Georgia;text-shadow:0 2px 3px #000}.spell-bar span{font-size:11px;color:#c1c0ab}.spell-slot{display:grid;justify-items:center;gap:3px}.spell-bar [data-spell="2"]{background:radial-gradient(circle,#ffb026 0%,#b03704 33%,#180e08 66%)}.spell-bar [data-spell="2"] img{width:78%;height:78%;filter:sepia(1) saturate(9)}.target-plate{position:absolute;transform:translate(-50%,-100%);width:130px;text-align:center;font-size:13px}.hp-track{height:5px;border:1px solid #282820;background:#15140f;margin:5px 0 2px}.hp-fill{height:100%;background:#a46636;transition:width .1s}.target-plate small{font:10px monospace;color:#c1c0ab}.combat-error{position:absolute;left:0;right:0;bottom:92px;text-align:center;color:#e7ab83;font-size:14px;pointer-events:none}.damage-number{position:absolute;transform:translate(-50%,-100%);font:bold 22px Georgia;color:#ffd274;text-shadow:1px 2px 2px #000}
.sound-toggle{position:absolute;right:16px;bottom:16px;pointer-events:auto;background:#181b16b8;color:#b7b49e;border:1px solid #484936;padding:4px 8px;font:10px Georgia;cursor:pointer}
.cast-progress{position:absolute;bottom:92px;left:50%;width:200px;transform:translateX(-50%);text-align:center;font-size:12px}.cast-progress>div{height:6px;background:#160e08;border:1px solid #815a2e;margin:6px 0 3px}.cast-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#913014,#ffc957);box-shadow:0 0 12px #ef752478}.cast-progress small{font:11px monospace;color:#e7bc7c}
</style></head><body><canvas id="renderCanvas" tabindex="0"></canvas><div id="loading">Entering the churchyard…</div><div id="help"><b>ASHEN REACH</b> &nbsp; WASD · RMB look · Space jump · Tab target · 1 Fire Blast · 2 Lava Ball · C armory · V camera · R reset · H hide controls</div><div id="error"></div><script type="module" src="/src/ashen-reach/main.js"></script></body></html>
