<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonwell — Babylon Lite</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #02050c;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #error {
        position: fixed;
        inset: 16px;
        color: #ffb4b4;
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <pre id="error"></pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
